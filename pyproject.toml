    { name = "anshu-man-6", email = "anshumanpandey8885@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "bs4>=0.0.2",
    "dotenv>=0.9.9",
    "huggingface-hub>=1.30.0",
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "lxml>=6.1.3",
    "readability>=0.3.2",
    "readability-lxml>=0.9",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "streamlit>=1.63.0",
    "tavily>=1.1.0",
    "trafilatura>=2.2.0",
    "transformers>=5.16.1",
]

[project.scripts]
multi-agent-research-system = "multi_agent_research_system:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
